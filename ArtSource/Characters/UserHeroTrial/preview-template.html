<!doctype html><html lang="zh-CN"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>白发主角待机试播</title>
<style>*{box-sizing:border-box}body{margin:0;padding:28px;background:#14251c;color:#edf2eb;font:16px system-ui}header,main{max-width:1200px;margin:0 auto}h1{font-size:26px}p{line-height:1.65;color:#b9cfbd}button,select{padding:8px 12px;margin:4px;border:1px solid #647e5c;border-radius:7px;background:#2f4836;color:#fff;font:inherit}main{display:grid;grid-template-columns:repeat(auto-fit,minmax(250px,1fr));gap:14px;margin-top:24px}.card{background:#263d2c;padding:16px;border-radius:12px;border:1px solid #526c4e}h2{margin:0;font-size:20px}canvas{width:100%;height:310px;image-rendering:pixelated;background:radial-gradient(ellipse at 50% 50%,#6f834f,#3c5a36 65%,#244330);border-radius:8px;margin-top:14px}.frame{color:#f3dca6;font-size:14px}aside{background:#2b4231;padding:12px;border-radius:8px;line-height:1.65}</style>
<header><h1>白发主角 · 四方向待机试播</h1><p>从你提供的展示板提取，每方向选取 8 帧，保持原像素；已去掉棋盘格并对齐脚底。</p><aside>此页用于比较外观与试播效果。展示板并非原始透明精灵图，选取的帧存在造型/站姿变化，循环不代表正式动画质量。正式制作应使用独立透明帧或规则精灵表。</aside><p><button id="play">暂停</button><button id="step">下一帧</button><label>帧率 <select id="fps"><option value="4">4 fps</option><option selected value="8">8 fps</option><option value="12">12 fps</option></select></label><button id="background">切换背景</button></p></header><main></main>
<script>
const source='__SHEET__',im=new Image();let running=true,time=0,last=0,checker=false;const names=['向下 · 正面','向左 · 侧面','向右 · 侧面','向上 · 背面'];const cards=names.map((name,i)=>{const el=document.createElement('section');el.className='card';el.innerHTML=`<h2>${name}</h2><canvas width="360" height="360"></canvas><p class="frame"></p>`;document.querySelector('main').append(el);return{el,canvas:el.querySelector('canvas'),row:i}});document.querySelector('#play').onclick=()=>{running=!running;document.querySelector('#play').textContent=running?'暂停':'播放'};document.querySelector('#step').onclick=()=>{running=false;time+=1/Number(document.querySelector('#fps').value);document.querySelector('#play').textContent='播放'};document.querySelector('#background').onclick=()=>{checker=!checker;for(const c of cards)c.canvas.style.background=checker?'repeating-conic-gradient(#ddd 0% 25%,#aaa 0% 50%) 50%/24px 24px':''};function draw(t){if(last&&running)time+=(t-last)/1000;last=t;const index=Math.floor(time*Number(document.querySelector('#fps').value))%8;for(const c of cards){const ctx=c.canvas.getContext('2d');ctx.clearRect(0,0,360,360);ctx.imageSmoothingEnabled=false;ctx.drawImage(im,index*96,c.row*112,96,112,36,2,288,336);ctx.strokeStyle='#c2cf91';ctx.beginPath();ctx.moveTo(25,314.5);ctx.lineTo(335,314.5);ctx.stroke();c.el.querySelector('.frame').textContent=`第 ${index+1}/8 帧`;}requestAnimationFrame(draw)}im.onload=()=>requestAnimationFrame(draw);im.src=source;
</script></html>
