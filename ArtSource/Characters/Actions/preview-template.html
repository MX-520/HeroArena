<!doctype html>
<html lang="zh-CN"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>角色动作预览</title>
<style>
*{box-sizing:border-box}body{margin:0;background:#172622;color:#edf7ef;font:16px system-ui,sans-serif;padding:28px}header{max-width:1100px;margin:auto}h1{font-size:26px;margin:0 0 8px}p{color:#b4c8bc;line-height:1.6}button,select{font:inherit;padding:8px 12px;background:#294137;color:#fff;border:1px solid #557864;border-radius:8px;margin:4px}main{max-width:1200px;margin:24px auto;display:grid;grid-template-columns:repeat(auto-fit,minmax(250px,1fr));gap:16px}.card{background:#233b30;border:1px solid #45604f;border-radius:14px;padding:16px}.card h2{margin:0;font-size:20px}.card canvas{width:100%;height:260px;image-rendering:pixelated;background:repeating-conic-gradient(#31483a 0% 25%,#36513f 0% 50%) 50%/24px 24px;border-radius:8px;margin:12px 0}.info{font-size:13px;color:#b9d1c0;min-height:40px}.frame{font-variant-numeric:tabular-nums;color:#ffe5a8}.note{background:#314b3a;padding:12px;border-radius:8px}
</style>
<header><h1>角色动作预览</h1><p>主角与三类哥布林 · 身体动作与武器分层</p><div class="note">这是动作素材候选预览，尚未替换游戏内角色。武器握点、出手轨迹和攻击范围仍需接入校准。原图透明边缘、移动步态和角色大小需要继续目视确认。</div><p><button id="play">暂停</button><button id="flip">左右镜像</button><button id="step">下一帧</button><label>速度 <select id="speed"><option value="0.5">0.5×</option><option selected value="1">1×</option><option value="1.5">1.5×</option></select></label></p></header><main id="cards"></main>
<script>
const layout=__LAYOUT__,sources=__IMAGES__,images={};let running=true,mirror=false,clock=0,last=0;
const labels={Hero:'主角',GoblinMelee:'普通哥布林',GoblinRunner:'Runner',GoblinCaster:'远程哥布林',Idle:'待机',Walk:'行走',Run:'奔跑',Attack:'近战',AxeAttack:'挥斧',RangedShoot:'施法',Hurt:'受伤',Death:'死亡',Roll:'翻滚'};
const sheets=Object.fromEntries(layout.sheets.map(s=>[s.name,s]));
const cards=[];
for(const actor of ['Hero','GoblinMelee','GoblinRunner','GoblinCaster']){const clips=layout.clips.filter(c=>c.actor===actor),el=document.createElement('section');el.className='card';el.innerHTML=`<h2>${labels[actor]}</h2><canvas width="500" height="440"></canvas><select>${clips.map((c,i)=>`<option value="${i}">${labels[c.name]||c.name}</option>`).join('')}</select><p class="frame"></p><p class="info"></p>`;document.querySelector('#cards').append(el);cards.push({el,canvas:el.querySelector('canvas'),clips,select:el.querySelector('select')});}
for(const [name,src]of Object.entries(sources)){images[name]=new Image();images[name].src=src;}
document.querySelector('#play').onclick=()=>{running=!running;document.querySelector('#play').textContent=running?'暂停':'播放'};
document.querySelector('#flip').onclick=()=>mirror=!mirror;
document.querySelector('#step').onclick=()=>{running=false;clock+=.16;document.querySelector('#play').textContent='播放'};
function draw(t){if(last&&running)clock+=(t-last)/1000*Number(document.querySelector('#speed').value);last=t;for(const card of cards){const clip=card.clips[Number(card.select.value)],s=sheets[clip.sheet],phase=(clock%clip.duration)/clip.duration;let index=0;clip.phases.forEach((v,i)=>{if(phase>=v)index=i});const f=s.frames.find(f=>f.name===clip.frames[index]),ctx=card.canvas.getContext('2d'),scale=230/(s.pixelsPerUnit*(card.clips[0].actor==='Hero'?1.735875:1.3279));ctx.clearRect(0,0,500,440);ctx.imageSmoothingEnabled=false;ctx.save();ctx.translate(250,365);if(mirror)ctx.scale(-1,1);ctx.drawImage(images[s.name],f.x,f.y,f.width,f.height,-f.pivotX*f.width*scale,-(1-f.pivotY)*f.height*scale,f.width*scale,f.height*scale);ctx.restore();ctx.strokeStyle='#92ad74';ctx.beginPath();ctx.moveTo(25,365.5);ctx.lineTo(475,365.5);ctx.stroke();card.el.querySelector('.frame').textContent=`第 ${index+1}/${clip.frames.length} 帧 · ${clip.duration.toFixed(3)} 秒`;card.el.querySelector('.info').textContent=clip.events.length?clip.events.map(e=>`${e.time.toFixed(3)}s ${e.function}`).join(' · '):'保留原动画时长与循环设置';}requestAnimationFrame(draw)}Promise.all(Object.values(images).map(i=>i.decode())).then(()=>requestAnimationFrame(draw));
</script></html>
